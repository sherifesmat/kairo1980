name: Deploy to Cloudflare

on:
  push:
    branches: [main]
    # Docs and the zone spreadsheet never reach the browser, so a change to
    # them alone should not spend a deployment.
    paths-ignore:
      - '**.md'
      - 'data/**'
      - 'tools/**'
      - '.github/workflows/fetch-reviews.yml'
  workflow_dispatch:
  # Called by fetch-reviews.yml: a push made with GITHUB_TOKEN deliberately
  # does not trigger other workflows, so refreshed reviews would otherwise sit
  # in the repo without ever reaching the live site.
  workflow_call:

permissions:
  contents: read

# A deploy publishes the whole directory, so two overlapping runs would race
# to define "current". Queue them instead, and never cancel a half-finished
# upload.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Nothing reaches production unless a guest can still order. Loop
  # WEBSITE_ORDERING (KBOSS), F / W02-06. Four scenarios, in a real browser,
  # against the real Worker in `wrangler dev` with a disposable local D1:
  # a pickup order recorded in the books, a failed payment falling back to
  # paying on site, an order scheduled past a closure, and pickup with
  # switch-back. No Cloudflare secret is in this job; the admin login and the
  # report token below are throwaway values that exist only on this runner.
  #
  # tools/check-gate.mjs reads the JSON report and fails the gate unless each
  # of the four ran exactly once and passed: Playwright's own exit code is 0
  # for a run that skipped everything.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Disposable local admin and report token
        run: |
          printf 'ADMIN_USER=devuser\nADMIN_PASSWORD=dev-password-not-a-real-one\nREPORT_TOKEN=gate-%s\n' "$(openssl rand -hex 12)" > .dev.vars

      - name: Disposable local database
        run: npx wrangler d1 migrations apply kairo1980-payments --local --persist-to ../.kairo1980-dev-state

      - name: Run the four ordering scenarios
        env:
          KAIRO_GATE: '1'
          PLAYWRIGHT_JSON_OUTPUT_NAME: gate-results.json
          KAIRO_PW_OUT: ${{ runner.temp }}/test-results
        run: npx playwright test --project=gate --reporter=list,json

      - name: The gate held only if all four ran and passed
        if: always()
        run: node tools/check-gate.mjs gate-results.json

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: gate-browser-evidence
          path: |
            ${{ runner.temp }}/test-results/
            gate-results.json

  deploy:
    needs: [gate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          # build-sitemap.py dates each URL from the last commit that touched
          # it, which needs more than the default single-commit checkout.
          fetch-depth: 0

      # 24, not 22: the payment tests run against a real SQLite database
      # through node:sqlite, which is only stable from 24.
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      # Guards against publishing a site whose scripts cannot parse. The pages
      # have no build step, so this is the only thing standing between a typo
      # in config.js and a dead basket in production.
      - name: Check that the browser scripts parse
        run: |
          for file in lang.js config.js order.js app.js qr.js pay.js zones.js postcode.js fetch-reviews.js; do
            node --check "$file"
            echo "ok: $file"
          done

      - name: Install dependencies
        run: npm ci

      # Money. Nothing reaches production without these passing: pricing,
      # the payment state machine, and the whole checkout against a stubbed
      # PayPal — including the declines, replays and lost callbacks.
      - name: Run the test suite
        run: npm test

      # A placeholder database id would fail inside wrangler with a message
      # that explains nothing. Fail here instead, saying exactly what to do.
      - name: Check the payments database is configured
        run: |
          if grep -q 'PASTE_D1_DATABASE_ID_HERE' wrangler.jsonc; then
            echo "::error::wrangler.jsonc still has the placeholder database_id."
            echo "Run 'npx wrangler d1 create kairo1980-payments' and paste the id it prints."
            exit 1
          fi
          echo "ok: d1 database id is set"

      # Applying migrations needs D1 permission on the API token, which a
      # Workers-only token does not have. It is also a privileged schema
      # operation, and running one on every price change is asking for
      # trouble — so it runs only when a migration actually changed.
      #
      # When that cannot be determined (a manual run, a first push), it runs
      # anyway: a migration silently skipped is far worse than one applied
      # twice, and applying is idempotent.
      - name: Did the schema change?
        id: schema
        run: |
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "no previous commit to compare against — running migrations"
          elif git diff --name-only "$before" "${{ github.sha }}" | grep -q '^migrations/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "migrations/ changed — will apply"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no schema change — skipping"
          fi

      # Migration 0006 makes one payment pay for at most one order, with a
      # unique index. Should production already hold a payment linked to two
      # orders, the index cannot be built. So this is asked first, and it says
      # why in plain words instead of leaving a half-applied migration. Only
      # counts are printed, never an order. Loop WEBSITE_ORDERING (KBOSS), B4.
      - name: No payment is already linked to two orders
        id: preflight
        if: steps.schema.outputs.changed == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.114.0'
          command: 'd1 execute kairo1980-payments --remote --json --command "SELECT COUNT(*) AS duplicated FROM (SELECT payment_id FROM orders WHERE payment_id IS NOT NULL GROUP BY payment_id HAVING COUNT(*) > 1)"'

      - name: The preflight found none
        if: steps.schema.outputs.changed == 'true'
        env:
          OUT: ${{ steps.preflight.outputs.command-output }}
        run: |
          printf '%s' "$OUT" | python3 -c '
          import json, sys
          text = sys.stdin.read()
          rows = json.loads(text[text.index("["):])[0]["results"]
          n = int(rows[0]["duplicated"])
          print(f"payments linked to more than one order: {n}")
          sys.exit(1 if n else 0)
          '

      # The zone tools' own tests, including the pin of every tariff to the one that
      # was live before the towns were added (DELIVERY_PRICING DP-21-01, DP-22).
      # Before the migrations, so a failure here changes nothing in production.
      - name: Zone tools tests
        run: |
          python -m pip install --quiet openpyxl
          python -m unittest tests/tools/test_build_zones.py

      # The schema has to exist before the Worker that writes to it goes live.
      # Applying migrations is idempotent: already-applied ones are skipped.
      - name: Apply database migrations
        if: steps.schema.outputs.changed == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.114.0'
          command: d1 migrations apply kairo1980-payments --remote

      # zones.js is generated. If someone edited the spreadsheet and forgot to
      # rebuild — or hand-edited zones.js — the published prices would silently
      # disagree with the source of truth. Rebuild and compare.
      - name: Verify zones.js matches the spreadsheet
        run: |
          python -m pip install --quiet openpyxl
          cp zones.js zones.js.published
          python tools/build-zones.py
          if ! diff -q zones.js.published zones.js > /dev/null; then
            echo "::error::zones.js is out of date. Run 'python tools/build-zones.py' and commit the result."
            diff zones.js.published zones.js || true
            exit 1
          fi
          rm zones.js.published
          echo "ok: zones.js matches data/delivery_zones.xlsx"

      # Dates come from git history, so the published sitemap is accurate
      # without anyone remembering to edit it. Regenerated rather than
      # verified: there is no reason for a human to hand-maintain this file.
      - name: Regenerate sitemap.xml
        run: |
          python tools/build-sitemap.py
          python -c "import xml.dom.minidom; xml.dom.minidom.parse('sitemap.xml')"
          echo "sitemap.xml is well-formed"

      # v4 of the action runs on Node 24. v3 targeted Node 20, which GitHub has
      # deprecated and was already force-running on 24. v4's only breaking
      # change is its default Wrangler version, which does not affect us: the
      # version is pinned explicitly below.
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Pinned rather than floating so a deploy cannot break on its own.
          wranglerVersion: '4.114.0'
          command: deploy

      # IndexNow tells Bing, Yandex, Seznam and Naver that the page changed
      # instead of waiting to be crawled again. Google does not participate —
      # for Google, freshness comes from the sitemap and Search Console.
      # The key is public by design: it is served at /<key>.txt to prove we
      # control the domain, so there is nothing to keep secret here.
      - name: Ping IndexNow
        continue-on-error: true
        run: |
          KEY=168e760065044f7d27e17028d7ef2c88a1e8c5a1b83da9f1
          curl -sS -X POST https://api.indexnow.org/IndexNow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{
              \"host\": \"kairo1980.de\",
              \"key\": \"$KEY\",
              \"keyLocation\": \"https://kairo1980.de/$KEY.txt\",
              \"urlList\": [
                \"https://kairo1980.de/\",
                \"https://kairo1980.de/firmencatering\",
                \"https://kairo1980.de/impressum\",
                \"https://kairo1980.de/datenschutz\"
              ]
            }" -w '\nIndexNow HTTP %{http_code}\n'
